# OPC production CI and Cloudflare Pages deployment.
# Pull requests are validation-only. A push to main (or a manual run on main)
# deploys the exact build that passed the integrity checks below.

name: CI / Production Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opc-ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro type diagnostics
        continue-on-error: true
        run: npx astro check

      - name: Verify zero-downtime invariants
        run: node scripts/validate-zero-downtime-invariants.mjs

      - name: Verify full app page integrity
        run: node scripts/validate-app-page-integrity.mjs

      - name: Build production bundle
        run: npm run build

      - name: Validate Cloudflare deployment secrets
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy validated build to OPC Production
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name=opc \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="OPC production ${GITHUB_SHA}"

      - name: Build success
        run: echo "Build completed successfully"
