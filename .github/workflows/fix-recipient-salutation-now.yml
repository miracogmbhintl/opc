name: Fix Recipient Salutation Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-recipient-salutation-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opc-recipient-salutation-fix
  cancel-in-progress: false

jobs:
  fix-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch recipient salutation handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # InvoiceDetailPage.tsx: explicit dropdown incl. Keine Anrede,
          # sanitize legacy standalone Herr/Frau/Firma values, and reset
          # auto salutation whenever recipient mode changes.
          # ------------------------------------------------------------
          path = Path('src/components/InvoiceDetailPage.tsx')
          text = path.read_text(encoding='utf-8')

          anchor = """  const value = metadata[key];
          return value === null || value === undefined ? '' : String(value);
          }

          function getInvoiceRecipientEditor(invoice?: InvoiceRow | null) {"""
          replacement = """  const value = metadata[key];
          return value === null || value === undefined ? '' : String(value);
          }

          // OPC_RECIPIENT_SALUTATION_FIX_20260819
          function normalizeRecipientNamePart(value: unknown) {
            return String(value ?? '')
              .trim()
              .replace(/^(?:herrn?|frau|firma)(?:[\\s,.:;-]+|$)/i, '')
              .trim();
          }

          function normalizeRecipientFormOfAddress(value: unknown) {
            const source = String(value ?? '').trim();
            const normalized = source.toLocaleLowerCase('de-CH');

            if (!source || normalized === 'keine anrede' || normalized === 'ohne anrede') return '';
            if (normalized === 'herr' || normalized === 'herrn') return 'Herr';
            if (normalized === 'frau') return 'Frau';
            if (normalized === 'firma') return 'Firma';
            return source;
          }

          function getInvoiceRecipientEditor(invoice?: InvoiceRow | null) {"""
          text = must_replace(text, anchor, replacement, 'Invoice helper insertion')

          old = """  const explicitName = snapshotValue(client, [
            'contact_name',
            'contact_person',
            'full_name',
            'name',
          ]).replace(/^(Herr|Frau|Firma)\\s+/i, '');"""
          new = """  const explicitName = normalizeRecipientNamePart(
            snapshotValue(client, [
              'contact_name',
              'contact_person',
              'full_name',
              'name',
            ]),
          );"""
          text = must_replace(text, old, new, 'Invoice explicit name')

          old = """  const snapshotFirstName =
            snapshotValue(client, ['first_name', 'firstname']) ||
            (nameParts.length > 1 ? nameParts[0] : '');

          const snapshotLastName =
            snapshotValue(client, ['last_name', 'lastname']) ||
            (nameParts.length > 1
              ? nameParts.slice(1).join(' ')
              : explicitName && explicitName !== companyName
                ? explicitName
                : '');"""
          new = """  const snapshotFirstName =
            normalizeRecipientNamePart(
              snapshotValue(client, ['first_name', 'firstname']),
            ) ||
            (nameParts.length > 1 ? nameParts[0] : '');

          const snapshotLastName =
            normalizeRecipientNamePart(
              snapshotValue(client, ['last_name', 'lastname']),
            ) ||
            (nameParts.length > 1
              ? nameParts.slice(1).join(' ')
              : explicitName && explicitName !== companyName
                ? explicitName
                : '');"""
          text = must_replace(text, old, new, 'Invoice snapshot names')

          old = """  const formOfAddress = metadataField(
            invoice,
            'invoice_recipient_form_of_address',
            metadataField(invoice, 'offer_recipient_form_of_address', snapshotFormOfAddress),
          );

          const firstName = metadataField(
            invoice,
            'invoice_recipient_first_name',
            metadataField(invoice, 'offer_recipient_first_name', snapshotFirstName),
          );

          const lastName = metadataField(
            invoice,
            'invoice_recipient_last_name',
            metadataField(invoice, 'offer_recipient_last_name', snapshotLastName),
          );"""
          new = """  const formOfAddress = normalizeRecipientFormOfAddress(
            metadataField(
              invoice,
              'invoice_recipient_form_of_address',
              metadataField(invoice, 'offer_recipient_form_of_address', snapshotFormOfAddress),
            ),
          );

          const firstName = normalizeRecipientNamePart(
            metadataField(
              invoice,
              'invoice_recipient_first_name',
              metadataField(invoice, 'offer_recipient_first_name', snapshotFirstName),
            ),
          );

          const lastName = normalizeRecipientNamePart(
            metadataField(
              invoice,
              'invoice_recipient_last_name',
              metadataField(invoice, 'offer_recipient_last_name', snapshotLastName),
            ),
          );"""
          text = must_replace(text, old, new, 'Invoice resolved names')

          old = """  const lastNameForGreeting = lastName || [firstName, lastName].filter(Boolean).join(' ');
          const normalizedForm = formOfAddress.toLocaleLowerCase('de-CH');

          let salutationLine = 'Sehr geehrte Damen und Herren';

          if (normalizedForm.includes('herr')) {
            salutationLine = `Sehr geehrter Herr ${lastNameForGreeting}`.trim();
          } else if (normalizedForm.includes('frau')) {
            salutationLine = `Sehr geehrte Frau ${lastNameForGreeting}`.trim();
          } else if (resolvedCompanyName) {
            salutationLine = 'Sehr geehrte Damen und Herren';
          }"""
          new = """  const lastNameForGreeting = lastName || firstName;
          const normalizedForm = formOfAddress.toLocaleLowerCase('de-CH');

          let salutationLine = 'Sehr geehrte Damen und Herren';

          if (normalizedForm === 'herr' && lastNameForGreeting) {
            salutationLine = `Sehr geehrter Herr ${lastNameForGreeting}`;
          } else if (normalizedForm === 'frau' && lastNameForGreeting) {
            salutationLine = `Sehr geehrte Frau ${lastNameForGreeting}`;
          }"""
          text = must_replace(text, old, new, 'Invoice salutation derivation')

          anchor = """  function updateInvoiceMetadata(key: string, value: any) {
            setInvoice((previous) => {
              if (!previous) return previous;
              return {
                ...previous,
                metadata: {
                  ...getMetadata(previous),
                  [key]: value,
                },
              };
            });
          }

          function updateItem(index: number, key: string, value: any) {"""
          replacement = """  function updateInvoiceMetadata(key: string, value: any) {
            setInvoice((previous) => {
              if (!previous) return previous;
              return {
                ...previous,
                metadata: {
                  ...getMetadata(previous),
                  [key]: value,
                },
              };
            });
          }

          function updateInvoiceRecipientFormOfAddress(value: string) {
            const normalized = normalizeRecipientFormOfAddress(value);

            setInvoice((previous) => {
              if (!previous) return previous;
              return {
                ...previous,
                metadata: {
                  ...getMetadata(previous),
                  invoice_recipient_form_of_address: normalized,
                  // Empty means: derive the letter salutation again from the dropdown.
                  invoice_salutation: '',
                },
              };
            });
          }

          function updateItem(index: number, key: string, value: any) {"""
          text = must_replace(text, anchor, replacement, 'Invoice form update handler')

          old = """              <Field label=\"Anrede\">
                          <input
                            list=\"opc-invoice-recipient-salutations\"
                            value={recipientEditor.formOfAddress}
                            onChange={(event) =>
                              updateInvoiceMetadata(
                                'invoice_recipient_form_of_address',
                                event.target.value,
                              )
                            }
                            style={inputStyle}
                            placeholder=\"Herr, Frau oder Firma\"
                          />
                          <datalist id=\"opc-invoice-recipient-salutations\">
                            <option value=\"Herr\" />
                            <option value=\"Frau\" />
                            <option value=\"Firma\" />
                          </datalist>
                        </Field>"""
          new = """              <Field label=\"Anrede\">
                          <select
                            value={normalizeRecipientFormOfAddress(recipientEditor.formOfAddress)}
                            onChange={(event) =>
                              updateInvoiceRecipientFormOfAddress(event.target.value)
                            }
                            style={opcSelectStyle}
                          >
                            <option value=\"\">Keine Anrede</option>
                            <option value=\"Herr\">Herr</option>
                            <option value=\"Frau\">Frau</option>
                            <option value=\"Firma\">Firma</option>
                          </select>
                        </Field>"""
          text = must_replace(text, old, new, 'Invoice salutation dropdown')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # opc-document-html.ts: the shared HTML renderer used by invoice,
          # reminders and offers. Never render standalone Herr/Frau/Firma,
          # and company mode uses the company as QR debtor.
          # ------------------------------------------------------------
          path = Path('src/lib/opc-document-html.ts')
          text = path.read_text(encoding='utf-8')

          anchor = """function getQuoteSnapshot(invoice: any) {
            return asObject(invoice?.quote_snapshot);
          }

          function buildRecipient("""
          replacement = """function getQuoteSnapshot(invoice: any) {
            return asObject(invoice?.quote_snapshot);
          }

          // OPC_RECIPIENT_SALUTATION_FIX_20260819
          function normalizeRecipientNamePart(value: unknown) {
            return clean(value)
              .replace(/^(?:herrn?|frau|firma)(?:[\\s,.:;-]+|$)/i, '')
              .trim();
          }

          function normalizeRecipientFormOfAddress(value: unknown) {
            const source = clean(value);
            const normalized = source.toLocaleLowerCase('de-CH');

            if (!source || normalized === 'keine anrede' || normalized === 'ohne anrede') return '';
            if (normalized === 'herr' || normalized === 'herrn') return 'Herr';
            if (normalized === 'frau') return 'Frau';
            if (normalized === 'firma') return 'Firma';
            return source;
          }

          function buildRecipient("""
          text = must_replace(text, anchor, replacement, 'HTML helper insertion')

          old = """  const snapshotCompanyName = pick(clientRecord, ['company_name', 'business_name']);
            const snapshotFirstName = pick(clientRecord, ['first_name', 'firstname']);
            const snapshotLastName = pick(clientRecord, ['last_name', 'lastname']);
            const explicitName = pick(clientRecord, ['contact_name', 'full_name', 'billing_name', 'name']);
            const explicitNameParts = explicitName.split(/\\s+/).filter(Boolean);

            const companyName = overrideValue('offer_recipient_company_name', snapshotCompanyName);
            const firstName = overrideValue(
              'offer_recipient_first_name',
              snapshotFirstName || (explicitNameParts.length > 1 ? explicitNameParts[0] : ''),
            );
            const lastName = overrideValue(
              'offer_recipient_last_name',
              snapshotLastName || (explicitNameParts.length > 1 ? explicitNameParts.slice(1).join(' ') : explicitName),
            );
            const personName = [firstName, lastName].filter(Boolean).join(' ');

            const snapshotFormOfAddress = pick(clientRecord, ['salutation', 'anrede', 'form_of_address']);
            const formOfAddress = overrideValue(
              'offer_recipient_form_of_address',
              snapshotFormOfAddress,
            );"""
          new = """  const snapshotCompanyName = pick(clientRecord, ['company_name', 'business_name']);
            const snapshotFirstName = normalizeRecipientNamePart(
              pick(clientRecord, ['first_name', 'firstname']),
            );
            const snapshotLastName = normalizeRecipientNamePart(
              pick(clientRecord, ['last_name', 'lastname']),
            );
            const explicitName = normalizeRecipientNamePart(
              pick(clientRecord, ['contact_name', 'full_name', 'billing_name', 'name']),
            );
            const explicitNameParts = explicitName.split(/\\s+/).filter(Boolean);

            const companyName = overrideValue('offer_recipient_company_name', snapshotCompanyName);
            const firstName = normalizeRecipientNamePart(
              overrideValue(
                'offer_recipient_first_name',
                snapshotFirstName || (explicitNameParts.length > 1 ? explicitNameParts[0] : ''),
              ),
            );
            const lastName = normalizeRecipientNamePart(
              overrideValue(
                'offer_recipient_last_name',
                snapshotLastName || (explicitNameParts.length > 1 ? explicitNameParts.slice(1).join(' ') : explicitName),
              ),
            );
            const personName = [firstName, lastName].filter(Boolean).join(' ');

            const snapshotFormOfAddress = pick(clientRecord, ['salutation', 'anrede', 'form_of_address']);
            const formOfAddress = normalizeRecipientFormOfAddress(
              overrideValue(
                'offer_recipient_form_of_address',
                snapshotFormOfAddress,
              ),
            );"""
          text = must_replace(text, old, new, 'HTML recipient identity')

          old = """  const personLine = [formOfAddress, personName].filter(Boolean).join(' ').trim();
            const cityLine = [postalCode, city].filter(Boolean).join(' ');
            const addressLines = unique([
              companyName,
              personLine && personLine !== companyName ? personLine : '',
              streetLine,
              cityLine,
              country,
            ]);

            const salutationLower = formOfAddress.toLocaleLowerCase('de-CH');
            let salutationLine = 'Sehr geehrte Damen und Herren';
            if (salutationLower.includes('herr')) {
              salutationLine = `Sehr geehrter Herr ${lastName || personName}`.trim();
            } else if (salutationLower.includes('frau')) {
              salutationLine = `Sehr geehrte Frau ${lastName || personName}`.trim();
            }

            return {"""
          new = """  const salutationLower = formOfAddress.toLocaleLowerCase('de-CH');
            const personPrefix =
              salutationLower === 'herr' || salutationLower === 'frau'
                ? formOfAddress
                : '';
            const personLine = personName
              ? [personPrefix, personName].filter(Boolean).join(' ').trim()
              : '';
            const cityLine = [postalCode, city].filter(Boolean).join(' ');
            const addressLines = unique([
              companyName,
              personLine && personLine !== companyName ? personLine : '',
              streetLine,
              cityLine,
              country,
            ]);

            let salutationLine = 'Sehr geehrte Damen und Herren';
            if (salutationLower === 'herr' && (lastName || personName)) {
              salutationLine = `Sehr geehrter Herr ${lastName || personName}`;
            } else if (salutationLower === 'frau' && (lastName || personName)) {
              salutationLine = `Sehr geehrte Frau ${lastName || personName}`;
            }

            const companyRecipient =
              salutationLower === 'firma' ||
              (!salutationLower && Boolean(companyName));
            const fullName = companyRecipient
              ? (companyName || personName)
              : (personName || companyName);

            return {"""
          text = must_replace(text, old, new, 'HTML address/salutation')
          text = must_replace(
              text,
              "    fullName: personName || companyName,",
              "    fullName,",
              'HTML fullName',
          )
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # opc-document-pdf.ts: legacy jsPDF fallback must use the same
          # semantics, including QR debtor and invoice metadata overrides.
          # ------------------------------------------------------------
          path = Path('src/lib/opc-document-pdf.ts')
          text = path.read_text(encoding='utf-8')

          old = """function getClientDisplayName(clientSnapshot?: OPCDocumentParty, fallback?: string) {
            return getSnapshotValue(clientSnapshot, ['billing_name', 'company_name', 'full_name', 'name', 'contact_name']) || clean(fallback) || 'Kundin / Kunde';
          }"""
          new = """// OPC_RECIPIENT_SALUTATION_FIX_20260819
          function normalizeRecipientNamePart(value: unknown) {
            return clean(value)
              .replace(/^(?:herrn?|frau|firma)(?:[\\s,.:;-]+|$)/i, '')
              .trim();
          }

          function normalizeRecipientFormOfAddress(value: unknown) {
            const source = clean(value);
            const normalized = source.toLocaleLowerCase('de-CH');
            if (!source || normalized === 'keine anrede' || normalized === 'ohne anrede') return '';
            if (normalized === 'herr' || normalized === 'herrn') return 'Herr';
            if (normalized === 'frau') return 'Frau';
            if (normalized === 'firma') return 'Firma';
            return source;
          }

          function getClientDisplayName(clientSnapshot?: OPCDocumentParty, fallback?: string) {
            const companyName = getSnapshotValue(clientSnapshot, ['company_name', 'business_name']);
            const billingName = normalizeRecipientNamePart(
              getSnapshotValue(clientSnapshot, ['billing_name']),
            );
            const personName = normalizeRecipientNamePart(
              getSnapshotValue(clientSnapshot, ['full_name', 'name', 'contact_name']),
            );

            return companyName || billingName || personName || clean(fallback) || 'Kundin / Kunde';
          }"""
          text = must_replace(text, old, new, 'PDF display name')

          anchor = """export function getClientEmail(clientSnapshot?: OPCDocumentParty) {
            return getSnapshotValue(clientSnapshot, ['billing_email', 'email', 'primary_email', 'contact_email']);
          }

          function buildRecipientLines("""
          replacement = """export function getClientEmail(clientSnapshot?: OPCDocumentParty) {
            return getSnapshotValue(clientSnapshot, ['billing_email', 'email', 'primary_email', 'contact_email']);
          }

          function getInvoiceFallbackRecipient(invoice: Record<string, any>) {
            const metadata =
              invoice?.metadata &&
              typeof invoice.metadata === 'object' &&
              !Array.isArray(invoice.metadata)
                ? invoice.metadata
                : {};
            const client = invoice?.client_snapshot || {};
            const site = invoice?.site_snapshot || {};

            const formOfAddress = normalizeRecipientFormOfAddress(
              Object.prototype.hasOwnProperty.call(metadata, 'invoice_recipient_form_of_address')
                ? metadata.invoice_recipient_form_of_address
                : metadata.offer_recipient_form_of_address,
            );
            const firstName = normalizeRecipientNamePart(
              metadata.invoice_recipient_first_name ??
              metadata.offer_recipient_first_name ??
              getSnapshotValue(client, ['first_name', 'firstname']),
            );
            const lastName = normalizeRecipientNamePart(
              metadata.invoice_recipient_last_name ??
              metadata.offer_recipient_last_name ??
              getSnapshotValue(client, ['last_name', 'lastname']),
            );
            const personName = [firstName, lastName].filter(Boolean).join(' ');
            const companyName = clean(
              metadata.invoice_recipient_company_name ??
              metadata.offer_recipient_company_name,
            ) || getSnapshotValue(client, ['company_name', 'business_name']) ||
              normalizeRecipientNamePart(getSnapshotValue(client, ['billing_name']));

            const normalizedForm = formOfAddress.toLocaleLowerCase('de-CH');
            const companyRecipient =
              normalizedForm === 'firma' ||
              (!normalizedForm && Boolean(companyName));
            const name = companyRecipient
              ? (companyName || personName)
              : (personName || companyName || getClientDisplayName(client, invoice.title));

            const snapshotAddress =
              getSnapshotValue(client, ['billing_address', 'address_text', 'address']) ||
              getSnapshotValue(site, ['address_text', 'address']) ||
              '';
            const street = clean(
              metadata.invoice_recipient_street ?? metadata.offer_recipient_street,
            ) || splitAddress(snapshotAddress)[0] || '';
            const postalCode = clean(
              metadata.invoice_recipient_postal_code ?? metadata.offer_recipient_postal_code,
            ) || getSnapshotValue(site, ['postal_code', 'postcode', 'zip']) ||
              getSnapshotValue(client, ['postal_code', 'postcode', 'zip']);
            const city = clean(
              metadata.invoice_recipient_city ?? metadata.offer_recipient_city,
            ) || getSnapshotValue(site, ['city', 'billing_city']) ||
              getSnapshotValue(client, ['city', 'billing_city']);
            const country = clean(
              metadata.invoice_recipient_country ?? metadata.offer_recipient_country,
            ) || getSnapshotValue(client, ['country']) || getSnapshotValue(site, ['country']) || 'Schweiz';

            return { name, street, postalCode, city, country };
          }

          function buildRecipientLines("""
          text = must_replace(text, anchor, replacement, 'PDF invoice recipient helper')

          text = must_replace(
              text,
              """  fallbackClientName?: string;
            logoDataUrl?: string | null;
          }) {""",
              """  fallbackClientName?: string;
            recipientLines?: string[];
            logoDataUrl?: string | null;
          }) {""",
              'PDF drawHeader type',
          )
          text = must_replace(
              text,
              """  drawSmallLines(doc, buildRecipientLines(input.clientSnapshot, input.siteSnapshot, input.fallbackClientName), margin, 28, { maxWidth: 82, lineHeight: 4.7 });""",
              """  const recipientLines = input.recipientLines?.length
              ? input.recipientLines
              : buildRecipientLines(input.clientSnapshot, input.siteSnapshot, input.fallbackClientName);
            drawSmallLines(doc, recipientLines, margin, 28, { maxWidth: 82, lineHeight: 4.7 });""",
              'PDF drawHeader lines',
          )

          old = """function buildQrBillData(invoice: Record<string, any>, totals: OPCDocumentTotals) {
            const client = invoice.client_snapshot || {};
            const site = invoice.site_snapshot || {};
            const debtorName = getClientDisplayName(client, invoice.title);
            const address = getSnapshotValue(client, ['billing_address', 'address_text', 'address']) || getSnapshotValue(site, ['address_text', 'address']) || '';
            const postalCode = getSnapshotValue(site, ['postal_code', 'postcode', 'zip']) || getSnapshotValue(client, ['postal_code', 'postcode', 'zip']);
            const city = getSnapshotValue(site, ['city', 'billing_city']) || getSnapshotValue(client, ['city', 'billing_city']);
            const debtorStreet = splitStreet(splitAddress(address)[0] || '');"""
          new = """function buildQrBillData(invoice: Record<string, any>, totals: OPCDocumentTotals) {
            const recipient = getInvoiceFallbackRecipient(invoice);
            const debtorName = recipient.name;
            const postalCode = recipient.postalCode;
            const city = recipient.city;
            const debtorStreet = splitStreet(recipient.street);"""
          text = must_replace(text, old, new, 'PDF QR recipient')

          old = """  let y = drawHeader(doc, { title: 'Rechnung', number: String(invoice.invoice_number || ''), dateLine, clientSnapshot: invoice.client_snapshot, siteSnapshot: invoice.site_snapshot, fallbackClientName: invoice.title, logoDataUrl });"""
          new = """  const fallbackRecipient = getInvoiceFallbackRecipient(invoice);
            const recipientLines = compact([
              fallbackRecipient.name,
              fallbackRecipient.street,
              compact([fallbackRecipient.postalCode, fallbackRecipient.city]).join(' '),
              fallbackRecipient.country,
            ]);

            let y = drawHeader(doc, {
              title: 'Rechnung',
              number: String(invoice.invoice_number || ''),
              dateLine,
              clientSnapshot: invoice.client_snapshot,
              siteSnapshot: invoice.site_snapshot,
              fallbackClientName: invoice.title,
              recipientLines,
              logoDataUrl,
            });"""
          text = must_replace(text, old, new, 'PDF invoice header recipient')
          path.write_text(text, encoding='utf-8')

          print('Recipient salutation patch applied to 3 files.')
          PY

      - name: Show and validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          grep -n "OPC_RECIPIENT_SALUTATION_FIX_20260819" \
            src/components/InvoiceDetailPage.tsx \
            src/lib/opc-document-html.ts \
            src/lib/opc-document-pdf.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit repair to main
        shell: bash
        run: |
          git config user.name "OPC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/components/InvoiceDetailPage.tsx \
            src/lib/opc-document-html.ts \
            src/lib/opc-document-pdf.ts
          git commit -m "Fix recipient salutation and company printing"
          git push origin HEAD:main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy portal to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name opc --branch main
