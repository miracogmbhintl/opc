name: Fix Recipient Salutation Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-recipient-salutation-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opc-recipient-salutation-fix
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify repair is committed
        shell: bash
        run: |
          python3 .github/scripts/fix-recipient-salutation.py
          git diff --check
          git diff --exit-code
          grep -n "OPC_RECIPIENT_SALUTATION_FIX_20260819" \
            src/components/InvoiceDetailPage.tsx \
            src/lib/opc-document-html.ts \
            src/lib/opc-document-pdf.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Deploy and persist verification
        shell: bash
        run: |
          set +e
          CREDS_STATUS="present"
          DEPLOY_STATUS="failed"
          DEPLOY_URL=""

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CREDS_STATUS="missing"
          else
            DEPLOY_OUTPUT="$(npx wrangler pages deploy dist --project-name opc --branch main 2>&1)"
            DEPLOY_EXIT=$?
            printf '%s\n' "$DEPLOY_OUTPUT"
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              DEPLOY_STATUS="success"
              DEPLOY_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -1)"
            fi
          fi

          mkdir -p .github/deployments
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "build_status=success"
            echo "cloudflare_credentials=$CREDS_STATUS"
            echo "deploy_status=$DEPLOY_STATUS"
            echo "deployment_url=$DEPLOY_URL"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/deployments/recipient-salutation-latest.txt

          git config user.name "OPC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployments/recipient-salutation-latest.txt
          git commit -m "Record recipient salutation deployment verification"
          git push origin HEAD:main

          if [ "$DEPLOY_STATUS" != "success" ]; then
            exit 1
          fi
