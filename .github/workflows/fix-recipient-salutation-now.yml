name: Fix Recipient Salutation Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-recipient-salutation-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opc-recipient-salutation-fix
  cancel-in-progress: false

jobs:
  fix-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply recipient repair
        run: python3 .github/scripts/fix-recipient-salutation.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          grep -n "OPC_RECIPIENT_SALUTATION_FIX_20260819" \
            src/components/InvoiceDetailPage.tsx \
            src/lib/opc-document-html.ts \
            src/lib/opc-document-pdf.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "OPC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/components/InvoiceDetailPage.tsx \
            src/lib/opc-document-html.ts \
            src/lib/opc-document-pdf.ts
          git commit -m "Fix recipient salutation and company printing"
          git push origin HEAD:main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy portal to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name opc --branch main
